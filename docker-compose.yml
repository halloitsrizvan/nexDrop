services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: nexdrop
      POSTGRES_PASSWORD: nexdrop
      POSTGRES_DB: nexdrop
    volumes:
      - nexdrop_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexdrop -d nexdrop"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nexdrop_pg:
